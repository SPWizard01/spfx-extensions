name: NodeJS with Gulp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        gulp bundle --ship
        gulp package-solution --ship
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spfx-solution
        path: ./dist/deploy/sp-fx-extensions.sppkg
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        make_latest: true
        files: |
          ./dist/deploy/sp-fx-extensions.sppkg
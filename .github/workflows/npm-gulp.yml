name: NodeJS with Gulp

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@v1 # Don't use @master or @v1 unless you're happy to test the latest version
        id: autotag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
          WITH_V: false
          DEFAULT_BUMP: patch

      - name: Replace values in JSON file
        uses: tnikFi/json-file-transform@v1
        with:
          files: "**/package-solution.json"
          key-value-pairs: |
            solution.version=${{ steps.autotag.outputs.tag }}.0

      - name: Build
        run: |
          npm install
          gulp bundle --ship
          gulp package-solution --ship

      - name: Artifact
        uses: actions/upload-artifact@v4
        if: steps.autotag.outputs.old_tag != ''
        with:
          name: spfx-solution
          path: ./dist/deploy/sp-fx-extensions.sppkg

      - name: Release
        uses: softprops/action-gh-release@v2
        if: steps.autotag.outputs.old_tag != ''
        with:
          make_latest: true
          tag_name: ${{ steps.autotag.outputs.tag }}
          files: |
            ./dist/deploy/sp-fx-extensions.sppkg

name: NodeJS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for OIDC

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        name: Setup Bun

      - uses: salsify/action-detect-and-tag-new-version@v2
        id: tagauto
        with:
          create-tag: true

      - name: list tag output
        run: |
          echo "previous-version ${{ steps.tagauto.outputs.previous-version }}"
          echo "current-version ${{ steps.tagauto.outputs.current-version }}"
          echo "tagautotag ${{ steps.tagauto.outputs.tag }}"

      - name: Build
        run: |
          npm install
          npm run build

      - name: Artifact
        uses: actions/upload-artifact@v6
        if: steps.tagauto.outputs.previous-version != steps.tagauto.outputs.current-version && steps.tagauto.outputs.current-version != ''
        with:
          name: spfx-solution
          path: ./dist/deploy/sp-fx-extensions.sppkg

      - name: Release
        uses: softprops/action-gh-release@v2
        if: steps.tagauto.outputs.previous-version != steps.tagauto.outputs.current-version && steps.tagauto.outputs.current-version != ''
        with:
          make_latest: true
          tag_name: ${{ steps.tagauto.outputs.tag }}
          files: |
            ./dist/deploy/sp-fx-extensions.sppkg
      - name: "Release To NPM"
        if: steps.tagauto.outputs.previous-version != steps.tagauto.outputs.current-version && steps.tagauto.outputs.current-version != ''
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish
        # env:
        #   NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
